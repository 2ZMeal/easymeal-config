###############################
# 배포/전체 서비스 Docker 실행 용도 #
###############################

# EUREKA --------------------------------------------------
eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSATANCE_IP_ADDRESS}
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_IP_ADDRESS}:${server.port}

  client:
    service-url:
      defaultZone: http://10.0.10.80:8761/eureka

# SPRING --------------------------------------------------
spring:
  jpa:
    hibernate:
      # 운영 안정성 등을 고려하여 배포 또는 테스트환경에서 DB가 변경되지 않고 검증만 하도록 합니다.
      ddl-auto: update

  kafka:
    bootstrap-servers: 10.0.10.80:9092

# MONITORING -----------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"

  endpoint:
    health:
      show-details: when_authorized

  tracing:
    sampling:
      probability: 0.1 # 운영 환경에서는 트래픽이 많을 수 있으므로 0.1, 0.05등으로 낮추는 것을 검토할 것

  zipkin:
    tracing:
      endpoint: http://10.0.10.80:9411/api/v2/spans
